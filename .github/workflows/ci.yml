name: Frontend CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality-gate-and-docker-verify:
    name: Code Quality Check & Smoke Test Container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install exact dependencies cleanly (npm ci)
        run: npm ci

      # Single unified quality gate (Prettier format:check + ESLint + TypeScript + Vitest + Vite build)
      - name: 4. Run full frontend quality check (npm run check)
        run: npm run check

      - name: 5. Build Docker image & Verify Container Healthcheck
        run: |
          docker build -t team262-frontend:${{ github.sha }} .
          docker run -d --name frontend_smoke_test -p 8080:80 team262-frontend:${{ github.sha }}

          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' frontend_smoke_test)
            if [ "$STATUS" = "healthy" ]; then
              echo "Smoke test container is HEALTHY!"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "ERROR: Smoke test container failed healthcheck!"
              docker logs frontend_smoke_test
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:8080/healthz
          curl --fail --silent --show-error http://localhost:8080/ | grep -i "<!doctype html>"
          docker rm -f frontend_smoke_test