name: Frontend Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Frontend CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mate-team-project-262/frontend

jobs:
  build-and-push:
    name: Build & Push Immutable Docker Image to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha_tag: ${{ steps.short_sha.outputs.sha_tag }}
    steps:
      - name: 1. Checkout verified repository source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 2. Compute immutable short SHA tag
        id: short_sha
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha_tag=sha-${FULL_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 3. Set up Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: 4. Authenticate with GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Build Multi-Stage Image and Push (:sha and :latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.short_sha.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend SHA Container to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha_tag }}"
            echo "=== Deploying immutable frontend image: $TARGET_IMAGE ==="
            cd /home/ubuntu/infra/compose

            # 1. Pin the exact immutable sha- tag in .env
            if grep -q '^FRONTEND_IMAGE=' .env; then
              sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${TARGET_IMAGE}|" .env
            else
              echo "FRONTEND_IMAGE=${TARGET_IMAGE}" >> .env
            fi

            # 2. Pull and recreate frontend container
            docker compose pull frontend
            docker compose up -d frontend

            # 3. Poll real Docker healthcheck status instead of blind sleep 6
            echo "Polling moviematch_frontend health status..."
            for i in {1..15}; do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' moviematch_frontend)
              if [ "$STATUS" = "healthy" ]; then
                echo "Frontend container is HEALTHY!"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "ERROR: Frontend container failed healthcheck! Dumping logs:"
                docker compose logs --tail=50 frontend
                exit 1
              fi
              echo "Waiting for frontend healthcheck... (attempt $i/15, status: $STATUS)"
              sleep 2
            done

            # 4. Reload Nginx gateway to refresh upstream container DNS IP
            docker exec moviematch_gateway nginx -s reload

            # 5. Clean up old images and verify public gateway response
            docker image prune -f
            curl --fail --silent --show-error https://what2watch.duckdns.org/gateway-health > /dev/null
            echo "=== Frontend deployment ($TARGET_IMAGE) completed and verified ==="