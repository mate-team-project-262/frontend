server {
    listen 80;
    server_name _;

    # Security by Default: Hide Nginx version in response headers
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for fast bundle delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Basic browser security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cache static immutable assets (Vite generates unique content hashes in filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Routing Fallback: Route all virtual React client paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container healthcheck endpoint for smoke tests and Docker healthchecks
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}